<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Metacreative Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --base: #F5F0E8;
      --surface: #FAF8F5;
      --white: #FDFCFA;
      --text-primary: #2C3330;
      --text-secondary: #6B6560;
      --text-muted: #9E9690;
      --border: #E5DFD6;
      --sage-50: #F4F6F2;
      --sage-100: #E2E8DD;
      --sage-400: #8B9A7D;
      --sage-600: #5E6E52;
      --gold-50: #FDF9EE;
      --gold-400: #C4A057;
      --rose-50: #FDF5F3;
      --rose-400: #E8A598;
      --blue-50: #F0F5FA;
      --blue-400: #5B8DB8;
      --purple-50: #F5F2F8;
      --purple-400: #9B7DC4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
      background: var(--base);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ---- Auth Screen ---- */
    .auth-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .auth-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .auth-box h1 {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .auth-box p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .auth-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-input:focus {
      border-color: var(--sage-400);
    }

    .auth-input.error {
      border-color: var(--rose-400);
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .auth-btn {
      width: 100%;
      margin-top: 1rem;
      padding: 12px;
      background: var(--sage-400);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .auth-btn:hover {
      background: var(--sage-600);
    }

    /* ---- Admin Content ---- */
    .admin-content {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.5rem 4rem;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .admin-header h1 {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .admin-header .badge {
      font-size: 0.75rem;
      color: var(--sage-600);
      background: var(--sage-50);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 500;
    }

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .article-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: var(--white);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
    }

    .article-item:hover {
      background: var(--surface);
    }

    .article-type {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .type-radio { background: var(--sage-400); }
    .type-talk { background: var(--blue-400); }
    .type-rich { background: var(--purple-400); }

    .article-info {
      flex: 1;
      min-width: 0;
    }

    .article-title {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .article-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 0.75em;
    }

    .article-status {
      flex-shrink: 0;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
      white-space: nowrap;
    }

    .status-public {
      color: var(--sage-600);
      background: var(--sage-50);
    }

    .status-limited {
      color: var(--gold-400);
      background: var(--gold-50);
    }

    .copy-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }

    .copy-btn:hover {
      background: var(--sage-50);
      border-color: var(--sage-400);
    }

    .copy-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .copy-btn:hover svg {
      stroke: var(--sage-600);
    }

    .copy-btn.copied {
      background: var(--sage-50);
      border-color: var(--sage-400);
    }

    .copy-btn.copied svg {
      stroke: var(--sage-600);
    }

    .copy-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text-primary);
      color: var(--white);
      font-size: 0.8rem;
      padding: 8px 20px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .admin-footer {
      margin-top: 2.5rem;
      text-align: center;
    }

    .admin-footer a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .admin-footer a:hover {
      color: var(--text-primary);
    }

    @media (max-width: 600px) {
      .article-item {
        padding: 1rem 1.25rem;
      }
      .article-title {
        font-size: 0.85rem;
      }
      .article-status {
        display: none;
      }
    }
  </style>
</head>
<body>

    <div class="auth-box">
      <h1>Showcase Admin</h1>
      <p>パスワードを入力してください</p>
      <form id="authForm">
        <input type="password" class="auth-input" id="authInput" placeholder="Password" autocomplete="off" autofocus>
        <button type="submit" class="auth-btn">Enter</button>
      </form>
    </div>
  </div>

    <div class="admin-footer">

    // Auth
    var authForm = document.getElementById('authForm');
    var authInput = document.getElementById('authInput');

    // Check session
    if (sessionStorage.getItem('showcase_auth') === '1') {
      showAdmin();
    }

    authForm.addEventListener('submit', function(e) {
      e.preventDefault();
      if (btoa(authInput.value) === PASS_KEY) {
        sessionStorage.setItem('showcase_auth', '1');
        showAdmin();
      } else {
        authInput.classList.add('error');
        setTimeout(function() { authInput.classList.remove('error'); }, 500);
        authInput.value = '';
      }
    });

    function showAdmin() {
      document.getElementById('authScreen').style.display = 'none';
      var content = document.getElementById('adminContent');
      content.style.display = 'block';

      document.getElementById('articleCount').textContent = articles.length + ' articles';

      var list = document.getElementById('articleList');
      var typeClasses = { radio: 'type-radio', talk: 'type-talk', rich: 'type-rich' };

      var baseUrl = location.origin + location.pathname.replace(/admin\.html$/, '');
      var copyIcon = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';
      var checkIcon = '<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
      var toast = document.getElementById('copyToast');
      var toastTimer;

      articles.forEach(function(a) {
        var el = document.createElement('div');
        el.className = 'article-item';

        var link = document.createElement('a');
        link.href = a.file;
        link.style.cssText = 'display:flex;align-items:center;gap:1rem;flex:1;min-width:0;text-decoration:none;color:inherit;';
        link.innerHTML =
          '<div class="article-type ' + typeClasses[a.type] + '">' + a.typeLabel + '</div>' +
          '<div class="article-info">' +
            '<div class="article-title">' + a.title + '</div>' +
            '<div class="article-meta"><span>' + a.date + '</span><span>' + a.source + '</span></div>' +
          '</div>';

        var status = document.createElement('span');
        status.className = 'article-status ' + (a.listed ? 'status-public' : 'status-limited');
        status.textContent = a.listed ? 'Public' : 'Limited';

        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.innerHTML = copyIcon;
        btn.title = 'URLをコピー';
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var url = baseUrl + a.file;
          navigator.clipboard.writeText(url).then(function() {
            btn.innerHTML = checkIcon;
            btn.classList.add('copied');
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1500);
            setTimeout(function() { btn.innerHTML = copyIcon; btn.classList.remove('copied'); }, 2000);
          });
        });

        el.appendChild(link);
        el.appendChild(status);
        el.appendChild(btn);
        list.appendChild(el);
      });
    }
