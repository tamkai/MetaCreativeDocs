<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Metacreative Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    /* Admin-specific styles */
    .auth-gate {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: var(--space-4);
    }
    .auth-gate input {
      font-family: var(--font-en);
      font-size: 0.9rem;
      padding: 0.6em 1.2em;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      outline: none;
      width: 240px;
      text-align: center;
    }
    .auth-gate input:focus {
      border-color: var(--sage-400);
    }
    .auth-error {
      font-size: 0.8rem;
      color: var(--red-400);
      display: none;
    }

    .admin-panel { display: none; }
    .admin-panel.visible { display: block; }

    /* Filters */
    .filters {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      margin-bottom: var(--space-6);
    }
    .filter-btn {
      font-family: var(--font-en);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.35em 0.8em;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s var(--ease);
    }
    .filter-btn.active {
      background: var(--sage-100);
      border-color: var(--sage-400);
      color: var(--sage-600);
    }
    .filter-btn:hover:not(.active) {
      border-color: var(--sage-200);
    }

    /* Document list */
    .doc-list { display: flex; flex-direction: column; gap: var(--space-3); }

    .doc-item {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-6);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: border-color 0.15s var(--ease);
    }
    .doc-item:hover { border-color: var(--sage-200); }

    .doc-item__date {
      font-family: var(--font-en);
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 80px;
    }
    .doc-item__title {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .doc-item__tags {
      display: flex;
      gap: var(--space-1);
      flex-wrap: wrap;
    }
    .doc-item__actions {
      display: flex;
      gap: var(--space-2);
    }
    .doc-item__link {
      font-family: var(--font-en);
      font-size: 0.7rem;
      padding: 0.3em 0.6em;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s var(--ease);
    }
    .doc-item__link:hover {
      border-color: var(--sage-400);
      color: var(--sage-600);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--dark-surface);
      color: var(--dark-text);
      font-size: 0.8rem;
      padding: 0.6em 1.2em;
      border-radius: var(--radius-md);
      opacity: 0;
      transition: all 0.3s var(--ease);
      pointer-events: none;
      z-index: 9000;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Stats */
    .stats {
      display: flex;
      gap: var(--space-6);
      margin-bottom: var(--space-8);
      flex-wrap: wrap;
    }
    .stat {
      text-align: center;
    }
    .stat__number {
      font-family: var(--font-en);
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--sage-600);
    }
    .stat__label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-header__brand">Metacreative Document</a>
      <nav class="site-header__nav">
        <a href="about.html" class="site-header__link">About</a>
        <a href="admin.html" class="site-header__link site-header__link--active">Admin</a>
      </nav>
    </div>
  </header>

  <!-- Auth Gate -->
  <div id="authGate" class="auth-gate">
    <p style="font-size: 0.85rem; color: var(--text-secondary);">管理画面にアクセスするにはパスワードを入力してください</p>
    <input type="password" id="pwInput" placeholder="Password" autofocus>
    <button class="btn btn--primary" onclick="tryAuth()">Enter</button>
    <p id="authError" class="auth-error">パスワードが違います</p>
  </div>

  <!-- Admin Panel -->
  <main id="adminPanel" class="admin-panel site-container--wide" style="padding: var(--space-8) var(--space-6);">

    <div class="stats" id="stats"></div>

    <div class="filters" id="filters"></div>

    <div class="doc-list" id="docList"></div>

  </main>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    // Simple password check (hash-based for minimal protection)
    // In production, use StatiCrypt for real encryption
    const PW_HASH = '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8'; // sha256 of "password"

    async function sha256(text) {
      const data = new TextEncoder().encode(text);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function tryAuth() {
      const pw = document.getElementById('pwInput').value;
      const hash = await sha256(pw);
      if (hash === PW_HASH) {
        sessionStorage.setItem('mcd-auth', 'true');
        showAdmin();
      } else {
        document.getElementById('authError').style.display = 'block';
      }
    }

    document.getElementById('pwInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryAuth();
    });

    function showAdmin() {
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('adminPanel').classList.add('visible');
      loadCatalog();
    }

    // Check session
    if (sessionStorage.getItem('mcd-auth') === 'true') {
      showAdmin();
    }

    // Catalog
    let catalog = [];
    let activeFilter = 'all';

    async function loadCatalog() {
      try {
        const res = await fetch('catalog.json');
        const data = await res.json();
        catalog = data.documents;
        renderStats();
        renderFilters();
        renderList();
      } catch (e) {
        document.getElementById('docList').innerHTML =
          '<p style="color: var(--text-muted); font-size: 0.85rem;">catalog.json の読み込みに失敗しました。</p>';
      }
    }

    function renderStats() {
      const total = catalog.length;
      const types = { radio: 0, transcript: 0, virtual: 0 };
      const formats = { standard: 0, rich: 0 };
      catalog.forEach(d => {
        types[d.type] = (types[d.type] || 0) + 1;
        if (d.formats.standard) formats.standard++;
        if (d.formats.rich) formats.rich++;
      });
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat__number">${total}</div><div class="stat__label">Total</div></div>
        <div class="stat"><div class="stat__number">${types.radio}</div><div class="stat__label">Radio</div></div>
        <div class="stat"><div class="stat__number">${types.transcript}</div><div class="stat__label">Transcript</div></div>
        <div class="stat"><div class="stat__number">${types.virtual}</div><div class="stat__label">Virtual</div></div>
        <div class="stat"><div class="stat__number">${formats.standard}</div><div class="stat__label">Standard</div></div>
        <div class="stat"><div class="stat__number">${formats.rich}</div><div class="stat__label">Rich</div></div>
      `;
    }

    function renderFilters() {
      const types = ['all', 'radio', 'transcript', 'virtual'];
      const labels = { all: 'All', radio: 'Radio', transcript: 'Transcript', virtual: 'Virtual' };
      document.getElementById('filters').innerHTML = types.map(t =>
        `<button class="filter-btn ${t === activeFilter ? 'active' : ''}" onclick="setFilter('${t}')">${labels[t]}</button>`
      ).join('');
    }

    function setFilter(type) {
      activeFilter = type;
      renderFilters();
      renderList();
    }

    function renderList() {
      const filtered = activeFilter === 'all'
        ? catalog
        : catalog.filter(d => d.type === activeFilter);

      // Sort by date descending
      filtered.sort((a, b) => b.date.localeCompare(a.date));

      const typeTag = { radio: 'tag--radio', transcript: 'tag--transcript', virtual: 'tag--virtual' };
      const typeLabel = { radio: 'R', transcript: 'T', virtual: 'V' };

      document.getElementById('docList').innerHTML = filtered.map(d => {
        const links = [];
        if (d.formats.standard) {
          links.push(`<button class="doc-item__link" onclick="copyUrl('${d.formats.standard}')">S Copy</button>`);
          links.push(`<a class="doc-item__link" href="${d.formats.standard}" target="_blank">S Open</a>`);
        }
        if (d.formats.rich) {
          links.push(`<button class="doc-item__link" onclick="copyUrl('${d.formats.rich}')">R Copy</button>`);
          links.push(`<a class="doc-item__link" href="${d.formats.rich}" target="_blank">R Open</a>`);
        }

        return `
          <div class="doc-item">
            <span class="doc-item__date">${d.date}</span>
            <span class="tag ${typeTag[d.type]}">${typeLabel[d.type]}</span>
            <span class="doc-item__title">${d.protected ? '🔒 ' : ''}${d.title}</span>
            <div class="doc-item__actions">${links.join('')}</div>
          </div>
        `;
      }).join('');
    }

    function copyUrl(path) {
      const base = window.location.origin + window.location.pathname.replace('admin.html', '');
      const url = base + path;
      navigator.clipboard.writeText(url).then(() => showToast('URL をコピーしました'));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  </script>

</body>
</html>
